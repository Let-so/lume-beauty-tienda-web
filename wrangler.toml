# Configuración de Cloudflare Pages.
#
# La tienda se sirve como archivos estáticos y la carpeta functions/ se
# convierte sola en la API. No hay paso de compilación: lo que está en el
# repositorio es lo que se publica.
#
# Para trabajar en la computadora:   npm run dev
# Para publicar:                     ver docs/PUBLICAR.md

name = "lume-beauty"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "."

# Base de datos. El database_id lo da Cloudflare al crear la base y hay que
# pegarlo acá. En la computadora no hace falta: wrangler usa una copia local.
[[d1_databases]]
binding = "DB"
database_name = "lume-beauty"
database_id = "f60c52b8-9b51-4cab-808a-a0c2e88f6f12"

# Las fotos de los productos. KV viene encendido con el plan gratuito: no hay
# que habilitar nada ni dar una tarjeta, al revés que R2.
[[kv_namespaces]]
binding = "FOTOS_KV"
id = "7ba834bfc81d4dfda10e443a364d2097"

# R2 es el lugar más apropiado para archivos y conviene si algún día hay
# muchas fotos o muy pesadas, pero hay que habilitarlo a mano desde el panel
# de Cloudflare. Si se habilita, se crea el depósito, se descomentan estas
# tres líneas y el código lo empieza a usar solo. Las fotos viejas siguen
# saliendo de KV: se busca en los dos lados.
# [[r2_buckets]]
# binding = "FOTOS"
# bucket_name = "lume-fotos"
