# Configuración de Cloudflare Pages.
#
# La tienda se sirve como archivos estáticos y la carpeta functions/ se
# convierte sola en la API. No hay paso de compilación: lo que está en el
# repositorio es lo que se publica.
#
# Para trabajar en la computadora:   npm run dev
# Para publicar:                     ver docs/PUBLICAR.md

name = "lume-beauty"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "."

# Base de datos. El database_id lo da Cloudflare al crear la base y hay que
# pegarlo acá. En la computadora no hace falta: wrangler usa una copia local.
[[d1_databases]]
binding = "DB"
database_name = "lume-beauty"
database_id = "f60c52b8-9b51-4cab-808a-a0c2e88f6f12"

# Depósito de fotos. Está comentado porque R2 todavía no está habilitado en
# esta cuenta: con el binding puesto, el despliegue falla entero. Sin él, todo
# el panel funciona y la única diferencia es que subir una foto nueva avisa
# que el depósito no está conectado.
#
# Para habilitarlo: panel de Cloudflare -> R2 Object Storage -> activar, crear
# el depósito "lume-fotos", descomentar estas tres líneas y publicar de nuevo.
# [[r2_buckets]]
# binding = "FOTOS"
# bucket_name = "lume-fotos"
