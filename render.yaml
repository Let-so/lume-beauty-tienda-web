# Cabeceras para que el navegador y la CDN no mezclen versiones de archivos.
# Si el servicio se creó desde el panel y no desde este blueprint, hay que
# copiar estas reglas en Render: Project configuration -> Redirects/Rewrites -> Headers.
services:
  - type: web
    name: lume-beauty-tienda-web
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    headers:
      - path: /*
        name: Cache-Control
        value: "public, max-age=0, must-revalidate"
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
