<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section data-screen-label="Rutina LUMÉ" style="position:relative;overflow:hidden;height:clamp(196px,25vw,300px);background:#e8cfc6;font-family:'Jost',sans-serif;color:#3f2a26">
  <img src="{{ ru.image }}" alt="{{ ru.alt }}" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 42%;display:block">
  <div aria-hidden="true" style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(244,232,226,0.97) 0%,rgba(243,230,223,0.92) 34%,rgba(240,221,212,0.45) 66%,rgba(238,216,206,0.05) 100%)"></div>
  <div style="position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;gap:clamp(6px,0.9vw,12px);padding:0 clamp(20px,4vw,62px);max-width:min(100%,640px)">
    <h2 style="margin:0;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(30px,4.2vw,58px);line-height:1;letter-spacing:-0.01em;color:#5c3129">{{ ru.title }}</h2>
    <p style="margin:0;max-width:24ch;font-family:'Cormorant Garamond',serif;font-size:clamp(15px,1.9vw,25px);line-height:1.25;color:#7a5248">{{ ru.text }}</p>
    <button onClick="{{ ru.open }}" style="align-self:flex-start;margin-top:clamp(6px,1vw,14px);height:clamp(38px,4.2vw,48px);padding:0 clamp(20px,2.4vw,32px);border:0;border-radius:999px;background:#b38d83;color:#fdf8f5;font-family:'Jost',sans-serif;font-size:clamp(9px,0.86vw,10.5px);letter-spacing:0.22em;transition:background .25s" style-hover="background:#a07a70">{{ ru.ctaLabel }}&nbsp;&nbsp;→</button>
  </div>
</section>
</x-dc>
</body>
</html>
