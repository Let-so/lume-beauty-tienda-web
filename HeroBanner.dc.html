<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ hero.wide }}" hint-placeholder-val="{{ true }}">
<section data-screen-label="Hero" style="position:relative;width:100%;aspect-ratio:1536 / 415;overflow:hidden;background:linear-gradient(100deg,#f1e6de 0%,#ecdcd1 40%,#e2cdc1 100%)">
  <img src="assets/hero/hero-productos-lume.png" alt="Medicube Deep Vita C y PDRN Pink Collagen, Numbuzin No.9 y brumas Victoria's Secret sobre piedra con pétalos" style="position:absolute;top:0;right:0;width:72.1%;height:100%;object-fit:cover;object-position:right center;-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 20%);mask-image:linear-gradient(90deg,transparent 0%,#000 20%)">
  <div style="position:absolute;top:0;bottom:0;left:0;display:flex;flex-direction:column;justify-content:center;padding:1.4% 0 0 5.9%">
    <h1 style="margin:0;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:5.35vw;line-height:0.9;letter-spacing:-0.012em;color:#4a231f">Tu piel,<br>tu <em style="font-style:italic;font-weight:500">momento.</em></h1>
    <p style="margin:1.5vw 0 0;font-family:'Cormorant Garamond',serif;font-size:max(13px,1.38vw);line-height:1.28;color:#7a5a52">Skincare y beauty seleccionados<br>para una piel sana, luminosa y real.</p>
    <button onClick="{{ hero.explore }}" style="margin-top:1.75vw;align-self:flex-start;width:max(200px,17.6vw);height:max(34px,2.75vw);border:0;border-radius:999px;background:#b38d83;color:#fdf8f5;font-family:'Jost',sans-serif;font-size:max(9px,0.72vw);letter-spacing:0.26em;transition:background .25s" style-hover="background:#a07a70">EXPLORAR PRODUCTOS&nbsp;&nbsp;→</button>
    <div aria-hidden="true" style="margin-top:2.5vw;display:flex;align-items:center;gap:0.8vw;font-family:'Jost',sans-serif;font-size:max(8px,0.6vw);letter-spacing:0.08em;color:#4a3530">
      <span>01</span><span style="width:1.6vw;height:1px;background:#a48a80"></span><span style="color:#9a8077">02</span><span style="color:#9a8077">03</span>
    </div>
  </div>
</section>
</sc-if>
<sc-if value="{{ hero.stacked }}">
<section data-screen-label="Hero" style="background:linear-gradient(180deg,#f1e6de 0%,#ead9cd 100%)">
  <div style="padding:38px 22px 28px">
    <h1 style="margin:0;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(44px,11.5vw,72px);line-height:0.92;letter-spacing:-0.012em;color:#4a231f">Tu piel,<br>tu <em style="font-style:italic;font-weight:500">momento.</em></h1>
    <p style="margin:16px 0 0;font-family:'Cormorant Garamond',serif;font-size:18px;line-height:1.3;color:#7a5a52;text-wrap:pretty">Skincare y beauty seleccionados para una piel sana, luminosa y real.</p>
    <button onClick="{{ hero.explore }}" style="margin-top:22px;height:46px;padding:0 30px;border:0;border-radius:999px;background:#b38d83;color:#fdf8f5;font-family:'Jost',sans-serif;font-size:10.5px;letter-spacing:0.24em" style-hover="background:#a07a70">EXPLORAR PRODUCTOS&nbsp;&nbsp;→</button>
  </div>
  <img src="assets/hero/hero-productos-lume.png" alt="Medicube Deep Vita C y PDRN Pink Collagen, Numbuzin No.9 y brumas Victoria's Secret sobre piedra con pétalos" style="display:block;width:100%;height:auto;aspect-ratio:2050 / 767;object-fit:cover">
</section>
</sc-if>
</x-dc>
</body>
</html>
