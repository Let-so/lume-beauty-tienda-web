<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section data-screen-label="Editorial" style="background:#ece1d9;font-family:'Jost',sans-serif;color:#3f2a26">
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));align-items:stretch">
    <div style="position:relative;min-height:clamp(220px,28vw,380px);background:#e4d3c8;overflow:hidden">
      <img src="{{ ed.image }}" alt="{{ ed.alt }}" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center">
    </div>
    <div style="display:flex;flex-direction:column;justify-content:center;gap:16px;padding:clamp(34px,4.5vw,64px) clamp(22px,3.5vw,58px)">
      <h2 style="margin:0;max-width:16ch;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(32px,3.6vw,54px);line-height:1;letter-spacing:-0.01em;color:#4a231f">{{ ed.title }}</h2>
      <p style="margin:0;max-width:46ch;font-size:13.5px;line-height:1.6;color:#6f5650">{{ ed.text }}</p>
      <button onClick="{{ ed.open }}" style="align-self:flex-start;margin-top:6px;height:46px;padding:0 30px;border:0;border-radius:999px;background:#b38d83;color:#fdf8f5;font-family:'Jost',sans-serif;font-size:10px;letter-spacing:0.24em;transition:background .25s" style-hover="background:#a07a70">{{ ed.ctaLabel }}&nbsp;&nbsp;→</button>
    </div>
  </div>
</section>
</x-dc>
</body>
</html>
