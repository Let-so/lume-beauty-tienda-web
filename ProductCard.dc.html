<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<article style="display:flex;flex-direction:column;height:100%;min-width:0;font-family:'Jost',sans-serif;color:#3f2a26">
  <div onClick="{{ product.open }}" role="link" aria-label="{{ product.openLabel }}" style="position:relative;aspect-ratio:200 / 184;background:#ece1d9;border-radius:4px;overflow:hidden;cursor:pointer;transition:background .3s" style-hover="background:#e8dad0">
    <img src="{{ product.image }}" alt="{{ product.alt }}" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:{{ product.imagePadding }};mix-blend-mode:multiply;transition:transform .7s cubic-bezier(.2,.7,.2,1)" style-hover="transform:scale(1.045)">
    <button onClick="{{ product.toggleFav }}" aria-label="{{ product.favLabel }}" aria-pressed="{{ product.isFav }}" style="position:absolute;top:7px;right:7px;width:32px;height:32px;border:0;border-radius:50%;background:transparent;display:flex;align-items:center;justify-content:center;color:#3f2a26;transition:background .2s" style-hover="background:rgba(243,234,228,0.75)">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="{{ product.heartFill }}" stroke="{{ product.heartStroke }}" stroke-width="1.4"><path d="M12 20.3s-7.6-4.6-7.6-10.3A4.2 4.2 0 0 1 12 7.5a4.2 4.2 0 0 1 7.6 2.5c0 5.7-7.6 10.3-7.6 10.3z"></path></svg>
    </button>
  </div>
  <div onClick="{{ product.open }}" style="padding:13px 4px 0;flex:1;display:flex;flex-direction:column;gap:2px;cursor:pointer">
    <span style="font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase">{{ product.brandLabel }}</span>
    <span style="font-size:11.5px;line-height:1.38">{{ product.title }}</span>
    <sc-if value="{{ product.hasSubtitle }}"><span style="font-size:11.5px;line-height:1.38;color:#6f5650">{{ product.subtitle }}</span></sc-if>
    <span style="font-size:11.5px;line-height:1.38">{{ product.size }}</span>
    <sc-if value="{{ product.hasPrice }}"><span style="margin-top:6px;font-family:'Cormorant Garamond',serif;font-size:19px;line-height:1;color:#4a231f">{{ product.priceLabel }}</span></sc-if>
  </div>
  <button onClick="{{ product.add }}" style="margin:16px 4px 0;height:28px;border:0;border-radius:999px;background:#e7d8ce;color:#4a3530;font-family:'Jost',sans-serif;font-size:9.5px;letter-spacing:0.16em;transition:background .25s" style-hover="background:#dcc6ba">{{ product.addLabel }}</button>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:220,&quot;height&quot;:340},&quot;product&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}"></script>
</body>
</html>
