<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<article style="display:flex;flex-direction:column;height:100%;min-width:0;font-family:'Jost',sans-serif;color:#3f2a26">
  <div onClick="{{ product.open }}" role="link" aria-label="{{ product.openLabel }}" style="position:relative;aspect-ratio:200 / 184;background:#ece1d9;border-radius:4px;overflow:hidden;cursor:pointer;transition:background .3s" style-hover="background:#e8dad0">
    <img src="{{ product.image }}" alt="{{ product.alt }}" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:{{ product.imagePadding }};mix-blend-mode:multiply;transition:transform .7s cubic-bezier(.2,.7,.2,1)" style-hover="transform:scale(1.045)">
    <sc-if value="{{ product.hasTag }}">
      <span style="position:absolute;top:8px;left:8px;z-index:2;padding:5px 9px;border-radius:3px;background:#5c3129;color:#f7ece6;font-family:'Jost',sans-serif;font-size:8.5px;line-height:1;letter-spacing:0.16em;white-space:nowrap">{{ product.tag }}</span>
    </sc-if>
    <button onClick="{{ product.toggleFav }}" aria-label="{{ product.favLabel }}" aria-pressed="{{ product.isFav }}" style="position:absolute;top:6px;right:6px;width:38px;height:38px;border:0;border-radius:50%;background:rgba(243,234,228,0.55);display:flex;align-items:center;justify-content:center;color:#3f2a26;transition:background .2s" style-hover="background:rgba(243,234,228,0.92)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="{{ product.heartFill }}" stroke="{{ product.heartStroke }}" stroke-width="1.4"><path d="M12 20.3s-7.6-4.6-7.6-10.3A4.2 4.2 0 0 1 12 7.5a4.2 4.2 0 0 1 7.6 2.5c0 5.7-7.6 10.3-7.6 10.3z"></path></svg>
    </button>
  </div>
  <div onClick="{{ product.open }}" role="link" aria-label="{{ product.openLabel }}" style="padding:12px 4px 0;flex:1;display:flex;flex-direction:column;gap:3px;cursor:pointer">
    <span style="font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#8a6d65">{{ product.brandLabel }}</span>
    <span style="font-size:12.5px;line-height:1.35;color:#3f2a26">{{ product.title }}</span>
    <sc-if value="{{ product.hasSubtitle }}"><span style="font-size:12.5px;line-height:1.35;color:#6f5650">{{ product.subtitle }}</span></sc-if>
    <span style="font-size:11px;line-height:1.35;color:#8a6d65">{{ product.size }}</span>
    <sc-if value="{{ product.hasPrice }}"><span style="margin-top:7px;font-family:'Cormorant Garamond',serif;font-size:23px;line-height:1;letter-spacing:0.01em;color:#4a231f">{{ product.priceLabel }}</span></sc-if>
  </div>
  <button onClick="{{ product.add }}" style="margin:13px 4px 0;height:38px;border:0;border-radius:999px;background:#b38d83;color:#fdf8f5;font-family:'Jost',sans-serif;font-size:9.5px;letter-spacing:0.2em;transition:background .25s" style-hover="background:#a07a70">{{ product.addLabel }}</button>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:220,&quot;height&quot;:380},&quot;product&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}"></script>
</body>
</html>
