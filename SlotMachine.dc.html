<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section data-screen-label="Tragamonedas" style="padding:clamp(42px,5vw,72px) clamp(18px,2.5vw,38px);background:#f3eae4;border-top:1px solid #e3d4ca;border-bottom:1px solid #e3d4ca;font-family:'Jost',sans-serif;color:#3f2a26">

  <div style="{{ sl.bannerStyle }}">
    <div aria-hidden="true" style="{{ sl.glowStyle }}"></div>

    <div style="{{ sl.textoStyle }}">
      <span style="{{ sl.logoStyle }}">LUMÉ<span style="{{ sl.logoSubStyle }}">BEAUTY</span></span>
      <h2 style="{{ sl.tituloStyle }}">{{ sl.title }}</h2>
      <p style="{{ sl.textStyle }}">{{ sl.text }}</p>
    </div>

    <div style="{{ sl.maquinaStyle }}">
      <div aria-hidden="true" style="{{ sl.leverStyle }}">
        <span style="{{ sl.leverKnobStyle }}"></span>
        <span style="{{ sl.leverBarStyle }}"></span>
      </div>
      <div style="{{ sl.screenStyle }}" aria-live="polite" aria-label="{{ sl.screenLabel }}">
        <sc-for list="{{ sl.reels }}" as="r" hint-placeholder-count="3">
          <div style="{{ sl.windowStyle }}">
            <div style="{{ r.stripStyle }}">
              <sc-for list="{{ r.items }}" as="it" hint-placeholder-count="8">
                <span style="{{ sl.tileStyle }}"><img src="{{ it.image }}" alt="" loading="lazy" style="max-width:86%;max-height:86%;object-fit:contain;mix-blend-mode:multiply"></span>
              </sc-for>
            </div>
          </div>
        </sc-for>
      </div>
      <button onClick="{{ sl.spin }}" disabled="{{ sl.disabled }}" style="{{ sl.buttonStyle }}">{{ sl.buttonLabel }}</button>
    </div>

  </div>

  <div style="max-width:620px;margin:clamp(16px,2.2vw,26px) auto 0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px">
    <sc-if value="{{ sl.hasMessage }}">
      <p style="{{ sl.messageStyle }}">{{ sl.message }}</p>
    </sc-if>
    <sc-if value="{{ sl.hasPrizeActions }}">
      <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:9px">
        <button onClick="{{ sl.addPrize }}" style="height:44px;padding:0 24px;border:0;border-radius:999px;background:#b38d83;color:#fdf8f5;font-size:10px;letter-spacing:0.2em" style-hover="background:#a07a70">{{ sl.addLabel }}</button>
        <button onClick="{{ sl.openPrize }}" style="height:44px;padding:0 24px;border:1px solid #cdb8ac;border-radius:999px;background:transparent;color:#4a3530;font-size:10px;letter-spacing:0.18em" style-hover="background:#ece0d8">VER EL PRODUCTO&nbsp;&nbsp;→</button>
      </div>
    </sc-if>
    <button onClick="{{ sl.toggleSound }}" aria-pressed="{{ sl.soundOn }}" aria-label="{{ sl.soundAria }}" style="background:none;border:0;padding:6px 2px;display:flex;align-items:center;gap:7px;font-family:'Jost',sans-serif;font-size:9.5px;letter-spacing:0.14em;color:#a8776a" style-hover="color:#7a3f34">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ sl.soundIcon }}"></path></svg>{{ sl.soundLabel }}
    </button>
  </div>
</section>
</x-dc>
</body>
</html>
