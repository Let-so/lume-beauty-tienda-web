<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section data-screen-label="Marcas" style="padding:clamp(40px,5vw,72px) clamp(18px,2.5vw,38px) clamp(46px,5.5vw,80px);background:#f3eae4;border-top:1px solid #e3d4ca;font-family:'Jost',sans-serif;color:#3f2a26">
  <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:12px 20px">
    <h2 style="margin:0;font-weight:400;font-size:12.5px;letter-spacing:0.2em">MARCAS DEL CATÁLOGO</h2>
    <button onClick="{{ br.viewAll }}" style="background:none;border:0;padding:4px 0;font-size:10px;letter-spacing:0.16em;color:#3f2a26;white-space:nowrap" style-hover="color:#a87a6e">VER TODAS LAS MARCAS&nbsp;&nbsp;→</button>
  </div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:clamp(8px,2vw,28px);margin-top:clamp(16px,2.4vw,30px)">
    <sc-for list="{{ br.items }}" as="b" hint-placeholder-count="3">
      <button onClick="{{ b.open }}" aria-label="{{ b.ariaLabel }}" style="display:block;width:100%;background:none;border:0;padding:0;cursor:pointer">
        <span style="position:relative;display:block;width:100%;aspect-ratio:1 / 1">
          <img src="{{ b.bag }}" alt="{{ b.alt }}" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 16px 20px rgba(92,49,41,0.20)) drop-shadow(0 4px 6px rgba(92,49,41,0.10));transition:transform .45s cubic-bezier(.2,.7,.2,1),filter .45s" style-hover="transform:translateY(-6px) scale(1.035);filter:drop-shadow(0 26px 30px rgba(92,49,41,0.26)) drop-shadow(0 7px 10px rgba(92,49,41,0.13))">
        </span>
      </button>
    </sc-for>
  </div>
</section>
</x-dc>
</body>
</html>
