<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section data-screen-label="Marcas" style="padding:clamp(40px,5vw,72px) clamp(18px,2.5vw,38px);background:#f3eae4;border-top:1px solid #e3d4ca;font-family:'Jost',sans-serif;color:#3f2a26">
  <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:12px 20px">
    <h2 style="margin:0;font-weight:400;font-size:12.5px;letter-spacing:0.2em">MARCAS DEL CATÁLOGO</h2>
    <button onClick="{{ br.viewAll }}" style="background:none;border:0;padding:4px 0;font-size:10px;letter-spacing:0.16em;color:#3f2a26;white-space:nowrap" style-hover="color:#a87a6e">VER TODAS LAS MARCAS&nbsp;&nbsp;→</button>
  </div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:9px;margin-top:20px">
    <sc-for list="{{ br.items }}" as="b" hint-placeholder-count="3">
      <button onClick="{{ b.open }}" aria-label="{{ b.ariaLabel }}" style="min-height:104px;border:1px solid #e3d4ca;border-radius:4px;background:#f8f1ec;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:18px 14px;color:#3f2a26;cursor:pointer;transition:background .3s,border-color .3s" style-hover="background:#efe3db;border-color:#d6bfb3">
        <span style="font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(22px,2.2vw,30px);line-height:1;letter-spacing:0.01em;color:#4a231f;text-align:center">{{ b.name }}</span>
        <span style="font-size:9.5px;letter-spacing:0.16em;color:#8a6d65">{{ b.countLabel }}</span>
      </button>
    </sc-for>
  </div>
</section>
</x-dc>
</body>
</html>
