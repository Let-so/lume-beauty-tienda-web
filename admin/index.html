<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Mi tienda · LUMÉ BEAUTY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --papel:#faf5f1; --tarjeta:#fff; --borde:#e6d8ce; --tinta:#3f2a26;
    --suave:#8a6d65; --marca:#b38d83; --marca-fuerte:#8f6a61; --oscuro:#5c3129;
    --bien:#2f6b4f; --mal:#9d3b3b; --aviso:#9a6b1f;
    --sombra:0 1px 2px rgba(92,49,41,.06), 0 8px 24px rgba(92,49,41,.07);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--papel);color:var(--tinta);
       font-family:'Jost',system-ui,sans-serif;font-size:15px;line-height:1.5;
       -webkit-text-size-adjust:100%}
  h1,h2,h3{font-family:'Cormorant Garamond',serif;font-weight:500;margin:0}
  button{font:inherit;cursor:pointer}
  input,select,textarea{font:inherit;color:inherit;width:100%;padding:11px 13px;
       border:1px solid var(--borde);border-radius:9px;background:var(--tarjeta)}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--marca);outline-offset:1px;border-color:transparent}
  textarea{min-height:92px;resize:vertical}
  label{display:block;font-size:12.5px;letter-spacing:.04em;color:var(--suave);margin:0 0 5px}
  .ayudita{font-size:12px;color:var(--suave);margin:5px 0 0;line-height:1.45}
  .campo{margin-bottom:17px}
  .fila{display:grid;gap:14px}
  @media(min-width:620px){.fila.dos{grid-template-columns:1fr 1fr}}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
       padding:11px 19px;border:0;border-radius:999px;background:var(--marca);
       color:#fff;letter-spacing:.06em;font-size:13.5px;transition:background .2s}
  .btn:hover{background:var(--marca-fuerte)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.linea{background:transparent;color:var(--tinta);border:1px solid var(--borde)}
  .btn.linea:hover{background:#f0e6df}
  .btn.peligro{background:var(--mal)}
  .btn.peligro:hover{background:#852f2f}
  .btn.chico{padding:7px 13px;font-size:12px}

  header.barra{position:sticky;top:0;z-index:30;background:rgba(250,245,241,.95);
       backdrop-filter:blur(8px);border-bottom:1px solid var(--borde);
       padding:11px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .logo{font-family:'Cormorant Garamond',serif;font-size:21px;letter-spacing:.14em;color:var(--oscuro)}
  .logo small{display:block;font-family:'Jost';font-size:8px;letter-spacing:.3em;color:var(--suave)}
  nav.menu{display:flex;gap:3px;overflow-x:auto;flex:1;scrollbar-width:none}
  nav.menu::-webkit-scrollbar{display:none}
  nav.menu button{background:none;border:0;padding:8px 13px;border-radius:999px;
       color:var(--suave);white-space:nowrap;font-size:13px}
  nav.menu button[aria-current="true"]{background:var(--oscuro);color:#fff}

  main{max-width:1060px;margin:0 auto;padding:22px 16px 90px}
  .tarjeta{background:var(--tarjeta);border:1px solid var(--borde);border-radius:14px;
       padding:19px;box-shadow:var(--sombra);margin-bottom:17px}
  .titulo{display:flex;justify-content:space-between;align-items:center;gap:12px;
       flex-wrap:wrap;margin-bottom:17px}
  .titulo h1{font-size:30px}

  .numeros{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:11px}
  .numero{background:var(--tarjeta);border:1px solid var(--borde);border-radius:12px;padding:15px}
  .numero b{display:block;font-family:'Cormorant Garamond',serif;font-size:31px;line-height:1.1}
  .numero span{font-size:11.5px;letter-spacing:.07em;color:var(--suave)}
  .numero.atencion b{color:var(--aviso)}

  .lista{display:grid;gap:11px}
  .prod{display:grid;grid-template-columns:62px 1fr;gap:13px;align-items:center;
       background:var(--tarjeta);border:1px solid var(--borde);border-radius:12px;
       padding:11px;text-align:left;width:100%;border-width:1px}
  .prod:hover{border-color:var(--marca)}
  .prod img{width:62px;height:62px;object-fit:contain;background:#f1e7e0;border-radius:8px}
  .prod .nom{font-size:14.5px;line-height:1.3}
  .prod .meta{font-size:12px;color:var(--suave);margin-top:3px}

  .chip{display:inline-block;padding:3px 9px;border-radius:999px;font-size:10.5px;
        letter-spacing:.08em;border:1px solid var(--borde);background:#f7f0ea}
  .chip.verde{color:var(--bien);border-color:#bcd9c9;background:#eef7f2}
  .chip.gris{color:var(--suave)}
  .chip.rojo{color:var(--mal);border-color:#e4c2c2;background:#fbf0f0}
  .chip.ambar{color:var(--aviso);border-color:#e6d2a8;background:#fdf6e7}

  .aviso{padding:13px 15px;border-radius:11px;font-size:13.5px;margin-bottom:15px;line-height:1.5}
  .aviso.ok{background:#eef7f2;color:var(--bien);border:1px solid #bcd9c9}
  .aviso.err{background:#fbf0f0;color:var(--mal);border:1px solid #e4c2c2}
  .aviso.info{background:#fdf6e7;color:var(--aviso);border:1px solid #e6d2a8}

  .fondo{position:fixed;inset:0;background:rgba(63,42,38,.45);display:flex;
       align-items:center;justify-content:center;padding:16px;z-index:50}
  .dialogo{background:var(--tarjeta);border-radius:16px;padding:23px;max-width:430px;width:100%}
  .dialogo h3{font-size:22px;margin-bottom:9px}
  .dialogo p{font-size:14px;color:var(--suave);margin:0 0 19px;line-height:1.55}
  .dialogo .acciones{display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}

  .entrar{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:20px}
  .entrar .caja{width:100%;max-width:380px}

  .fotos{display:flex;gap:9px;flex-wrap:wrap}
  .foto{position:relative;width:88px;height:88px;border:1px solid var(--borde);
        border-radius:10px;overflow:hidden;background:#f1e7e0}
  .foto img{width:100%;height:100%;object-fit:contain}
  .foto .quitar{position:absolute;top:3px;right:3px;width:22px;height:22px;border:0;
        border-radius:50%;background:rgba(63,42,38,.78);color:#fff;font-size:13px;line-height:1;padding:0}
  .foto .principal{position:absolute;bottom:0;left:0;right:0;background:rgba(92,49,41,.85);
        color:#fff;font-size:9px;text-align:center;letter-spacing:.08em;padding:2px}
  .soltar{border:1.5px dashed var(--borde);border-radius:10px;padding:17px;text-align:center;
        color:var(--suave);font-size:13px;cursor:pointer;width:88px;height:88px;
        display:flex;align-items:center;justify-content:center;background:var(--tarjeta)}
  .soltar.encima{border-color:var(--marca);background:#f7efe9}

  .renglon{display:flex;gap:8px;margin-bottom:8px;align-items:flex-start}
  .renglon input,.renglon textarea{flex:1}
  .renglon button{flex:0 0 auto}

  .pie{position:fixed;left:0;right:0;bottom:0;background:rgba(250,245,241,.97);
       backdrop-filter:blur(8px);border-top:1px solid var(--borde);padding:11px 16px;
       display:flex;gap:9px;justify-content:flex-end;z-index:25;
       padding-bottom:calc(11px + env(safe-area-inset-bottom))}
  .cargando{opacity:.55;pointer-events:none}
  .oculto{display:none !important}
  .centro{text-align:center;color:var(--suave);padding:34px 14px;font-size:14px}
  details.guia{border:1px solid var(--borde);border-radius:11px;padding:13px 15px;margin-bottom:10px;background:var(--tarjeta)}
  details.guia summary{cursor:pointer;font-size:14.5px}
  details.guia ol{margin:11px 0 0;padding-left:19px;font-size:13.5px;color:var(--suave);line-height:1.7}

  .codigo{border:1.5px solid var(--marca);border-radius:12px;padding:17px;text-align:center;
        background:#f7efe9;margin:13px 0}
  .codigo > b{display:block;font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
        font-size:clamp(19px,5.4vw,25px);letter-spacing:.14em;color:var(--marca);
        user-select:all;word-break:break-all}
  .codigo p{margin:9px 0 0;font-size:12.5px;color:var(--suave);line-height:1.6}
  .enlace{background:none;border:0;padding:0;color:var(--marca);font-size:13px;
        text-decoration:underline;cursor:pointer}
</style>
</head>
<body>
<div id="app"><div class="centro">Cargando…</div></div>

<script type="module">
import { derivarEnCliente, revisarPassword } from './clave.js';

// ───────────────────────── hablar con el servidor ─────────────────────────

function testigoCSRF() {
  const m = document.cookie.match(/(?:^|;\s*)lume_csrf=([^;]+)/);
  return m ? decodeURIComponent(m[1]) : '';
}

async function api(ruta, opciones = {}) {
  const cfg = { credentials: 'same-origin', headers: {}, ...opciones };
  if (cfg.body !== undefined && !(cfg.body instanceof FormData)) {
    cfg.headers['Content-Type'] = 'application/json';
    cfg.body = JSON.stringify(cfg.body);
  }
  if (cfg.method && cfg.method !== 'GET') cfg.headers['X-CSRF-Token'] = testigoCSRF();
  let r;
  try {
    r = await fetch(ruta, cfg);
  } catch {
    return { ok: false, error: 'No se pudo conectar. Revisá tu conexión a internet y probá de nuevo.' };
  }
  let cuerpo = {};
  try { cuerpo = await r.json(); } catch { /* respuesta sin JSON */ }
  if (r.status === 401 && estado.usuario) {
    estado.usuario = null;
    pintar();
    return { ok: false, error: 'Se cerró tu sesión. Volvé a entrar.' };
  }
  if (!r.ok && !cuerpo.error) cuerpo.error = 'Algo salió mal. Probá de nuevo en un momento.';
  return { ...cuerpo, _status: r.status };
}

// ─────────────────────────────── estado ───────────────────────────────

const estado = {
  usuario: null,
  pantalla: 'inicio',
  productos: [],
  resumen: {},
  categorias: [],
  marcas: [],
  etiquetas: [],
  mantenimiento: { active: false, title: '', message: '' },
  editando: null,
  sucio: false,
  mensaje: null,
  filtro: { q: '', estado: '' },
  dialogo: null,
  recuperando: false,
  cuenta: null,
  // El código de recuperación se muestra una sola vez: en la base queda solo
  // su resumen, así que si se pierde esta pantalla, se pierde el código.
  codigoNuevo: null,
};

function avisar(texto, tipo = 'ok') {
  estado.mensaje = { texto, tipo };
  pintar();
  if (tipo === 'ok') setTimeout(() => {
    if (estado.mensaje && estado.mensaje.texto === texto) { estado.mensaje = null; pintar(); }
  }, 4500);
}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// Las rutas del catálogo son relativas a la raíz del sitio. Desde /admin/ hay
// que anteponerles la barra, si no el navegador las busca dentro de /admin/ y
// las fotos no aparecen.
const urlFoto = u => !u ? '' : (/^(https?:|\/|data:)/.test(u) ? u : '/' + u);

const pesos = n => n === null || n === undefined
  ? 'A confirmar'
  : '$ ' + Number(n).toLocaleString('es-AR');

const ESTADO_CHIP = {
  published: '<span class="chip verde">Publicado</span>',
  draft: '<span class="chip gris">Borrador</span>',
  out_of_stock: '<span class="chip rojo">Sin stock</span>',
};

// ───────────────────────────── cargar datos ─────────────────────────────

async function cargarTodo() {
  const [prods, datos, mant, cuenta] = await Promise.all([
    api('/api/admin/productos?' + new URLSearchParams(
      Object.entries(estado.filtro).filter(([, v]) => v))),
    api('/api/admin/catalogo-datos'),
    api('/api/admin/mantenimiento'),
    api('/api/admin/cuenta'),
  ]);
  if (cuenta.ok) estado.cuenta = cuenta;
  if (prods.ok) { estado.productos = prods.productos; estado.resumen = prods.resumen; }
  if (datos.ok) {
    estado.categorias = datos.categorias;
    estado.marcas = datos.marcas;
    estado.etiquetas = datos.etiquetas;
  }
  if (mant.ok) estado.mantenimiento = mant.mantenimiento;
  pintar();
}

// ───────────────────────────── las pantallas ─────────────────────────────

function pantallaEntrar() {
  return `<div class="entrar"><div class="caja">
    <div style="text-align:center;margin-bottom:26px">
      <div class="logo" style="font-size:31px">LUMÉ<small>BEAUTY</small></div>
      <p class="ayudita" style="margin-top:9px">Panel de administración de la tienda</p>
    </div>
    <div class="tarjeta">
      <div id="msg"></div>
      <form id="formEntrar">
        <div class="campo">
          <label for="email">Tu correo</label>
          <input id="email" type="email" autocomplete="username" required autofocus>
        </div>
        <div class="campo">
          <label for="clave">Tu contraseña</label>
          <input id="clave" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn" style="width:100%" type="submit">ENTRAR</button>
      </form>
      <p class="ayudita" style="margin-top:15px;text-align:center">
        <button type="button" class="enlace" data-accion="ir-recuperar">No me acuerdo mi contraseña</button></p>
    </div>
  </div></div>`;
}

function pantallaRecuperar() {
  return `<div class="entrar"><div class="caja">
    <div style="text-align:center;margin-bottom:26px">
      <div class="logo" style="font-size:31px">LUMÉ<small>BEAUTY</small></div>
      <p class="ayudita" style="margin-top:9px">Recuperar el acceso</p>
    </div>
    <div class="tarjeta">
      <div id="msg"></div>
      ${estado.codigoNuevo ? recuadroCodigo() : `
      <p class="ayudita" style="margin-bottom:15px">
        Escribí el código de recuperación que anotaste cuando creamos tu cuenta.
        Son cuatro grupos de cuatro letras y números.</p>
      <form id="formRecuperar">
        <div class="campo">
          <label for="r-email">Tu correo</label>
          <input id="r-email" type="email" autocomplete="username" required autofocus>
        </div>
        <div class="campo">
          <label for="r-codigo">Código de recuperación</label>
          <input id="r-codigo" required placeholder="ABCD-EFGH-JKMN-PQRS"
                 autocapitalize="characters" spellcheck="false">
        </div>
        <div class="campo">
          <label for="r-nueva">Contraseña nueva</label>
          <input id="r-nueva" type="password" autocomplete="new-password" required>
          <small class="ayudita">Al menos 10 caracteres. Una frase que recuerdes es mejor que algo corto y complicado.</small>
        </div>
        <div class="campo">
          <label for="r-repetir">Escribila otra vez</label>
          <input id="r-repetir" type="password" autocomplete="new-password" required>
        </div>
        <button class="btn" style="width:100%" type="submit">CAMBIAR MI CONTRASEÑA</button>
      </form>`}
      <p class="ayudita" style="margin-top:15px;text-align:center">
        <button type="button" class="enlace" data-accion="ir-entrar">Volver a la pantalla de entrada</button></p>
    </div>
  </div></div>`;
}

function recuadroCodigo() {
  return `<div class="codigo">
    <small class="ayudita" style="letter-spacing:.14em">TU CÓDIGO DE RECUPERACIÓN NUEVO</small>
    <b>${esc(estado.codigoNuevo)}</b>
    <p>Anotalo en un papel y guardalo. <b>No se puede volver a ver</b>:
       en el sistema queda guardado de una forma que no permite leerlo.</p>
    <button class="btn linea chico" data-accion="copiar-codigo" style="margin-top:4px">COPIAR</button>
    <button class="btn chico" data-accion="ya-lo-anote" style="margin-top:4px">YA LO ANOTÉ</button>
  </div>`;
}

function pantallaCuenta() {
  const c = estado.cuenta || {};
  return `
  <div class="titulo"><h1>Mi cuenta</h1></div>

  <div class="tarjeta">
    <h2 style="font-size:20px">${esc(estado.usuario.name || '')}</h2>
    <p class="ayudita">${esc(estado.usuario.email || '')}</p>
  </div>

  <div class="tarjeta" style="margin-top:17px">
    <h2 style="font-size:20px;margin-bottom:4px">Cambiar mi contraseña</h2>
    <p class="ayudita" style="margin-bottom:14px">
      Si entraste en el teléfono de otra persona o te prestaron una computadora,
      cambiala. Al cambiarla, esas sesiones se cierran solas.</p>
    <form id="formClave">
      <div class="campo">
        <label for="c-actual">Tu contraseña de ahora</label>
        <input id="c-actual" type="password" autocomplete="current-password" required>
      </div>
      <div class="campo">
        <label for="c-nueva">La nueva</label>
        <input id="c-nueva" type="password" autocomplete="new-password" required>
        <small class="ayudita">Al menos 10 caracteres.</small>
      </div>
      <div class="campo">
        <label for="c-repetir">Escribila otra vez</label>
        <input id="c-repetir" type="password" autocomplete="new-password" required>
      </div>
      <button class="btn" type="submit">GUARDAR LA CONTRASEÑA NUEVA</button>
    </form>
  </div>

  <div class="tarjeta" style="margin-top:17px">
    <h2 style="font-size:20px;margin-bottom:4px">Mi código de recuperación</h2>
    <p class="ayudita" style="margin-bottom:12px">
      Es lo único que te deja volver a entrar si olvidás la contraseña.
      ${c.tieneCodigo
        ? 'Tenés uno sin usar. Si no sabés dónde lo anotaste, pedí uno nuevo: el anterior deja de servir.'
        : '<b>No tenés ninguno sin usar.</b> Pedí uno ahora y guardalo, o si olvidás la contraseña no vas a poder entrar sola.'}</p>
    ${estado.codigoNuevo ? recuadroCodigo() : `
    <form id="formCodigo">
      <div class="campo">
        <label for="k-actual">Tu contraseña, para confirmar que sos vos</label>
        <input id="k-actual" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn ${c.tieneCodigo ? 'linea' : ''}" type="submit">DAME UN CÓDIGO NUEVO</button>
    </form>`}
  </div>`;
}

function pantallaInicio() {
  const r = estado.resumen;
  const m = estado.mantenimiento;
  return `
  <div class="titulo"><h1>Hola, ${esc((estado.usuario.name || '').split(' ')[0])}</h1></div>

  <div class="tarjeta" style="border-color:${m.active ? 'var(--aviso)' : 'var(--borde)'}">
    <div style="display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap">
      <div>
        <h2 style="font-size:20px">${m.active ? 'La tienda está oculta' : 'La tienda está abierta'}</h2>
        <p class="ayudita">${m.active
          ? 'Los visitantes ven la pantalla de mantenimiento. Vos podés seguir trabajando con total normalidad.'
          : 'Los clientes ven el catálogo con todos los productos publicados.'}</p>
      </div>
      <button class="btn ${m.active ? '' : 'linea'}" data-accion="${m.active ? 'publicar' : 'mantener'}">
        ${m.active ? 'VOLVER A PUBLICAR LA TIENDA' : 'PONER TIENDA EN MANTENIMIENTO'}
      </button>
    </div>
  </div>

  <div class="numeros">
    <div class="numero"><b>${r.total ?? 0}</b><span>PRODUCTOS</span></div>
    <div class="numero"><b>${r.publicados ?? 0}</b><span>PUBLICADOS</span></div>
    <div class="numero"><b>${r.borradores ?? 0}</b><span>BORRADORES</span></div>
    <div class="numero ${r.sinStock ? 'atencion' : ''}"><b>${r.sinStock ?? 0}</b><span>SIN STOCK</span></div>
    <div class="numero ${r.stockBajo ? 'atencion' : ''}"><b>${r.stockBajo ?? 0}</b><span>POCO STOCK</span></div>
    <div class="numero ${r.sinPrecio ? 'atencion' : ''}"><b>${r.sinPrecio ?? 0}</b><span>SIN PRECIO</span></div>
  </div>

  <div class="tarjeta" style="margin-top:17px">
    <h2 style="font-size:20px;margin-bottom:11px">¿Qué querés hacer?</h2>
    <div style="display:flex;gap:9px;flex-wrap:wrap">
      <button class="btn" data-accion="nuevo">AGREGAR UN PRODUCTO</button>
      <button class="btn linea" data-ir="productos">VER MIS PRODUCTOS</button>
      <button class="btn linea" data-ir="ayuda">CÓMO SE USA</button>
    </div>
  </div>`;
}

function pantallaProductos() {
  const lista = estado.productos.length
    ? estado.productos.map(p => `
      <button class="prod" data-editar="${esc(p.id)}">
        <img src="${esc(urlFoto(p.image))}" alt="" loading="lazy"
             onerror="this.style.visibility='hidden'">
        <span>
          <span class="nom">${esc(p.name)}</span>
          <span class="meta">${esc(p.brandLabel || 'Sin marca')}${p.size ? ' · ' + esc(p.size) : ''} · ${pesos(p.price)}</span>
          <span class="meta" style="margin-top:6px;display:block">
            ${ESTADO_CHIP[p.status] || ''}
            ${p.stock !== null ? `<span class="chip ${p.stockBajo ? 'ambar' : ''}">${p.stock} en stock</span>` : ''}
            ${p.price === null ? '<span class="chip ambar">Falta el precio</span>' : ''}
            ${p.featured ? '<span class="chip">Destacado</span>' : ''}
          </span>
        </span>
      </button>`).join('')
    : `<div class="centro">No hay productos que coincidan con lo que buscaste.</div>`;

  return `
  <div class="titulo">

function pintar() {
  const app = document.getElementById('app');

  if (!estado.usuario) {
    app.innerHTML = estado.recuperando ? pantallaRecuperar() : pantallaEntrar();
    if (estado.mensaje) {
      document.getElementById('msg').innerHTML =
        `<div class="aviso ${estado.mensaje.tipo === 'ok' ? 'ok' : 'err'}">${esc(estado.mensaje.texto)}</div>`;
    }
    const entrar = document.getElementById('formEntrar');
    if (entrar) entrar.addEventListener('submit', alEntrar);
    const recuperar = document.getElementById('formRecuperar');
    if (recuperar) recuperar.addEventListener('submit', alRecuperar);
    conectar();
    return;
  }

  const pantallas = {
    inicio: pantallaInicio, productos: pantallaProductos,
    editor: pantallaEditor, ayuda: pantallaAyuda, cuenta: pantallaCuenta,
  };
  const menu = [['inicio', 'Inicio'], ['productos', 'Productos'],
                ['cuenta', 'Mi cuenta'], ['ayuda', 'Ayuda']];

  app.innerHTML = `
    <header class="barra">
      <div class="logo">LUMÉ<small>BEAUTY</small></div>
      <nav class="menu">${menu.map(([k, t]) =>
        `<button data-ir="${k}" aria-current="${estado.pantalla === k || (k === 'productos' && estado.pantalla === 'editor')}">${t}</button>`).join('')}</nav>
      <button class="btn linea chico" data-accion="salir">Salir</button>
    </header>
    <main>
      ${estado.mantenimiento.active && estado.pantalla !== 'inicio'
        ? '<div class="aviso info">La tienda está oculta para los visitantes. Acordate de volver a publicarla cuando termines.</div>' : ''}
      ${estado.mensaje ? `<div class="aviso ${estado.mensaje.tipo === 'ok' ? 'ok' : estado.mensaje.tipo === 'err' ? 'err' : 'info'}">${esc(estado.mensaje.texto)}</div>` : ''}
      ${(pantallas[estado.pantalla] || pantallaInicio)()}
    </main>
    ${estado.dialogo ? dibujarDialogo() : ''}`;

  const formClave = document.getElementById('formClave');
  if (formClave) formClave.addEventListener('submit', alCambiarClave);
  const formCodigo = document.getElementById('formCodigo');
  if (formCodigo) formCodigo.addEventListener('submit', alPedirCodigo);

  conectar();
}

function dibujarDialogo() {

    <h3>${esc(d.titulo)}</h3><p>${esc(d.texto)}</p>
    <div class="acciones">
      <button class="btn linea" data-dialogo="no">${esc(d.no || 'Cancelar')}</button>
      <button class="btn ${d.peligro ? 'peligro' : ''}" data-dialogo="si">${esc(d.si || 'Confirmar')}</button>

function preguntar(titulo, texto, { si, no, peligro } = {}) {
  return new Promise(resolver => {
    estado.dialogo = { titulo, texto, si, no, peligro, resolver };
    pintar();

}

async function alEntrar(e) {
  e.preventDefault();
  const boton = e.target.querySelector('button');
  boton.disabled = true;
  boton.textContent = 'ENTRANDO…';
  const volver = recordarCampos(['email', 'clave']);
  const email = document.getElementById('email').value.trim();
  // El estirado de la contrasena ocurre aca, en el navegador. Tarda alrededor
  // de medio segundo y por eso el boton avisa que esta trabajando.
  let clave;
  try {
    clave = await derivarEnCliente(email, document.getElementById('clave').value);
  } catch {
    avisar('Tu navegador no pudo preparar la contraseña. Probá con otro navegador o actualizá este.', 'err');
    volver();
    return;
  }
  const r = await api('/api/admin/sesion', { method: 'POST', body: { email, password: clave } });
  if (!r.ok) { avisar(r.error, 'err'); volver(); return; }
  estado.usuario = r.usuario;
  estado.mensaje = null;
  estado.pantalla = 'inicio';
  await cargarTodo();
}

// Mostrar un aviso vuelve a dibujar la pantalla, y eso borra lo que estaba
// escrito. En un formulario de contraseñas, equivocarse en una letra
// obligaría a escribir los tres campos de nuevo. Esto los devuelve a su lugar.
function recordarCampos(ids) {
  const valores = {};
  for (const id of ids) {
    const e = document.getElementById(id);
    if (e) valores[id] = e.value;
  }
  return () => {
    for (const id of ids) {
      const e = document.getElementById(id);
      if (e) e.value = valores[id];
    }
  };
}

// Devuelve la clave derivada, o null si la contraseña no pasa la regla o el
// navegador no puede derivarla. Avisa el motivo en los dos casos.
async function prepararClave(email, password, repetida) {
  if (repetida !== undefined && password !== repetida) {
    avisar('Las dos contraseñas no coinciden. Volvé a escribirlas.', 'err');
    return null;
  }
  const problema = revisarPassword(password);
  if (problema) { avisar(problema, 'err'); return null; }
  try {
    return await derivarEnCliente(email, password);
  } catch {
    avisar('Tu navegador no pudo preparar la contraseña. Probá con otro navegador o actualizá este.', 'err');
    return null;
  }
}

async function alRecuperar(e) {
  e.preventDefault();
  const boton = e.target.querySelector('button[type=submit]');
  const volver = recordarCampos(['r-email', 'r-codigo', 'r-nueva', 'r-repetir']);
  const email = document.getElementById('r-email').value.trim();
  const codigo = document.getElementById('r-codigo').value.trim().toUpperCase();
  const clave = await prepararClave(email,
    document.getElementById('r-nueva').value,
    document.getElementById('r-repetir').value);
  if (!clave) { volver(); return; }

  boton.disabled = true;
  boton.textContent = 'CAMBIANDO…';
  const r = await api('/api/admin/recuperar', {
    method: 'POST', body: { email, codigo, password: clave },
  });
  if (!r.ok) { avisar(r.error, 'err'); volver(); return; }

  // Entra directo: el servidor ya dejó la sesión abierta. Pero primero se le
  // muestra el código nuevo, porque no hay segunda oportunidad de verlo.
  estado.usuario = r.usuario;
  estado.codigoNuevo = r.codigoNuevo;
  estado.pantalla = 'cuenta';
  estado.recuperando = false;
  await cargarTodo();
  avisar(r.mensaje);
}

async function alCambiarClave(e) {
  e.preventDefault();
  const boton = e.target.querySelector('button[type=submit]');
  const volver = recordarCampos(['c-actual', 'c-nueva', 'c-repetir']);
  const email = estado.usuario.email;
  const actual = await (async () => {
    try { return await derivarEnCliente(email, document.getElementById('c-actual').value); }
    catch { return null; }
  })();
  if (!actual) { avisar('Tu navegador no pudo preparar la contraseña.', 'err'); volver(); return; }

  const nueva = await prepararClave(email,
    document.getElementById('c-nueva').value,
    document.getElementById('c-repetir').value);
  if (!nueva) { volver(); return; }

  boton.disabled = true;
  boton.textContent = 'GUARDANDO…';
  const r = await api('/api/admin/cuenta', {
    method: 'POST', body: { accion: 'cambiar-clave', actual, nueva },
  });
  if (!r.ok) { avisar(r.error, 'err'); volver(); return; }
  await cargarTodo();
  avisar(r.mensaje);
}

async function alPedirCodigo(e) {
  e.preventDefault();
  const boton = e.target.querySelector('button[type=submit]');
  const volver = recordarCampos(['k-actual']);
  let actual;
  try {
    actual = await derivarEnCliente(estado.usuario.email, document.getElementById('k-actual').value);
  } catch {
    avisar('Tu navegador no pudo preparar la contraseña.', 'err');
    volver();
    return;
  }
  boton.disabled = true;
  boton.textContent = 'GENERANDO…';
  const r = await api('/api/admin/cuenta', { method: 'POST', body: { accion: 'nuevo-codigo', actual } });
  if (!r.ok) { avisar(r.error, 'err'); volver(); return; }
  estado.codigoNuevo = r.codigo;
  await cargarTodo();
  avisar(r.mensaje);
}

function productoVacio() {
  return {
    _existe: false, id: '', name: '', brand: '', title: '', subtitle: '', size: '',
    price: null, compareAtPrice: null, stock: null, status: 'draft', featured: false,
    tag: '', warning: '', imagePadding: '6%', categories: [], images: [],
    description: [''], howTo: [], specs: [], tags: [],
  };
}

function leerFormulario() {
  const p = estado.editando;
  for (const el of document.querySelectorAll('[data-campo]')) {
    const k = el.dataset.campo;
    if (el.type === 'checkbox') p[k] = el.checked;
    else if (k === 'price' || k === 'compareAtPrice' || k === 'stock') {
      p[k] = el.value.trim() === '' ? null : el.value.trim();
    } else p[k] = el.value;
  }
  p.categories = [...document.querySelectorAll('[data-categoria]')]
    .filter(c => c.checked).map(c => c.dataset.categoria);
  for (const nombre of ['description', 'howTo']) {
    p[nombre] = [...document.querySelectorAll(`[data-lista="${nombre}"]`)]
      .map(t => t.value.trim()).filter(Boolean);
  }
  const etiquetas = [...document.querySelectorAll('[data-spec="label"]')].map(i => i.value.trim());
  const valores = [...document.querySelectorAll('[data-spec="value"]')].map(i => i.value.trim());
  p.specs = etiquetas.map((l, i) => ({ label: l, value: valores[i] || '' }))
                     .filter(s => s.label && s.value);
  return p;
}

async function guardar() {
  const p = leerFormulario();
  const nuevo = !p._existe;
  const r = await api(nuevo ? '/api/admin/productos' : `/api/admin/productos/${encodeURIComponent(p.id)}`,
                      { method: nuevo ? 'POST' : 'PUT', body: p });
  if (!r.ok) { avisar(r.error, 'err'); return; }
  estado.sucio = false;
  estado.editando = null;
  estado.pantalla = 'productos';
  await cargarTodo();
  avisar(r.mensaje || 'Cambios guardados.');
}

async function subirFotos(archivos) {
  const caja = document.getElementById('subiendo');
  for (const archivo of archivos) {
    caja.innerHTML = `<p class="ayudita">Subiendo ${esc(archivo.name)}…</p>`;
    const form = new FormData();
    form.append('foto', archivo);
    const r = await api('/api/admin/fotos', { method: 'POST', body: form });
    if (!r.ok) {
      caja.innerHTML = `<div class="aviso err">${esc(r.error)}${
        r.comoResolverlo ? '<br><small>' + esc(r.comoResolverlo) + '</small>' : ''}</div>`;
      return;
    }
    leerFormulario().images.push(r.url);
  }
  caja.innerHTML = '';
  estado.sucio = true;
  pintar();
}

function conectar() {
  const app = document.getElementById('app');

  app.onclick = async e => {
    const b = e.target.closest('button');
    if (!b) return;

    if (b.dataset.dialogo) {
      const d = estado.dialogo;
      estado.dialogo = null;
      pintar();
      d.resolver(b.dataset.dialogo === 'si');
      return;
    }
    if (b.dataset.ir) {
      if (estado.sucio && !(await preguntar('Tenés cambios sin guardar',
        'Si salís ahora se pierden los cambios que hiciste en este producto.',
        { si: 'Salir igual', no: 'Seguir editando', peligro: true }))) return;
      estado.sucio = false;
      estado.editando = null;
      estado.pantalla = b.dataset.ir;
      estado.mensaje = null;
      pintar();
      return;
    }
    if (b.dataset.editar) {
      const r = await api('/api/admin/productos/' + encodeURIComponent(b.dataset.editar));
      if (!r.ok) { avisar(r.error, 'err'); return; }
      estado.editando = { ...r.producto, _existe: true };
      estado.pantalla = 'editor';
      estado.sucio = false;
      pintar();
      return;
    }
    if (b.dataset.quitarFoto !== undefined) {
      leerFormulario().images.splice(Number(b.dataset.quitarFoto), 1);
      estado.sucio = true;
      pintar();
      return;
    }
    if (b.dataset.sumarLista) {
      const p = leerFormulario();
      p[b.dataset.sumarLista] = [...p[b.dataset.sumarLista], ''];
      pintar();
      return;
    }
    if (b.dataset.quitarLista) {
      const p = leerFormulario();
      p[b.dataset.quitarLista].splice(Number(b.dataset.i), 1);
      estado.sucio = true;
      pintar();
      return;
    }
    if (b.hasAttribute('data-sumar-spec')) {
      leerFormulario().specs.push({ label: '', value: '' });
      pintar();
      return;
    }
    if (b.dataset.quitarSpec !== undefined) {
      leerFormulario().specs.splice(Number(b.dataset.quitarSpec), 1);
      estado.sucio = true;
      pintar();
      return;
    }

    switch (b.dataset.accion) {
      case 'nuevo':
        estado.editando = productoVacio();
        estado.pantalla = 'editor';
        estado.sucio = false;
        pintar();
        break;
      case 'guardar':
        await guardar();
        break;
      case 'volver':
        if (estado.sucio && !(await preguntar('Tenés cambios sin guardar',
          'Si volvés ahora se pierden los cambios que hiciste.',
          { si: 'Descartar', no: 'Seguir editando', peligro: true }))) return;
        estado.sucio = false;
        estado.editando = null;
        estado.pantalla = 'productos';
        pintar();
        break;
      case 'borrar': {
        const p = estado.editando;
        if (!(await preguntar(`¿Borrar «${p.name}»?`,
          'El producto va a desaparecer de la tienda. Queda una copia guardada por si fue un error, pero no vas a poder recuperarlo vos sola.',
          { si: 'Sí, borrar', no: 'No, dejarlo', peligro: true }))) return;
        const r = await api('/api/admin/productos/' + encodeURIComponent(p.id), { method: 'DELETE' });
        if (!r.ok) { avisar(r.error, 'err'); return; }
        estado.editando = null;
        estado.sucio = false;
        estado.pantalla = 'productos';
        await cargarTodo();
        avisar(r.mensaje);
        break;
      }
      case 'mantener': {
        if (!(await preguntar('¿Ocultar la tienda?',
          'Los visitantes van a ver una pantalla de mantenimiento y no van a poder ver los productos ni los precios. Vos seguís trabajando normalmente.',
          { si: 'Sí, ocultar', no: 'Cancelar' }))) return;
        const r = await api('/api/admin/mantenimiento', { method: 'POST', body: { active: true } });
        if (!r.ok) { avisar(r.error, 'err'); return; }
        estado.mantenimiento = r.mantenimiento;
        pintar();
        avisar(r.mensaje);
        break;
      }
      case 'publicar': {
        if (!(await preguntar('¿Volver a publicar la tienda?',
          'Los clientes van a ver el catálogo con todos los cambios que guardaste. Los borradores siguen ocultos.',
          { si: 'Sí, publicar', no: 'Todavía no' }))) return;
        const r = await api('/api/admin/mantenimiento', { method: 'POST', body: { active: false } });
        if (!r.ok) { avisar(r.error, 'err'); return; }
        estado.mantenimiento = r.mantenimiento;
        pintar();
        avisar(r.mensaje);
        break;
      }
      case 'ir-recuperar':
        estado.recuperando = true;
        estado.mensaje = null;
        pintar();
        break;

      case 'ir-entrar':
        estado.recuperando = false;
        estado.codigoNuevo = null;
        estado.mensaje = null;
        pintar();
        break;

      case 'copiar-codigo': {
        // Solo cuando lo pide: nunca se toca el portapapeles por nuestra cuenta.
        try {
          await navigator.clipboard.writeText(estado.codigoNuevo);
          avisar('Código copiado. Igual anotalo en un papel: el portapapeles se borra.');
        } catch {
          avisar('Tu navegador no deja copiar automáticamente. Seleccioná el código y copialo a mano.', 'err');
        }
        break;
      }

      case 'ya-lo-anote': {
        if (!(await preguntar('¿Lo anotaste?',
          'El código no se puede volver a ver. Si lo perdés vas a tener que pedir otro, y para eso hace falta tu contraseña.',
          { si: 'Sí, lo anoté', no: 'Todavía no' }))) return;
        estado.codigoNuevo = null;
        pintar();
        break;
      }

      case 'salir': {
        if (!(await preguntar('¿Cerrar sesión?', 'Vas a tener que escribir tu contraseña para volver a entrar.',
          { si: 'Cerrar sesión', no: 'Quedarme' }))) return;
        await api('/api/admin/sesion', { method: 'DELETE' });
        estado.usuario = null;
        estado.sucio = false;
        pintar();
        break;
      }
    }
  };

  // Marcar que hay cambios sin guardar.
  app.oninput = e => {
    if (estado.pantalla === 'editor' && e.target.closest('main')) estado.sucio = true;
  };

  const buscar = document.getElementById('buscar');
  if (buscar) {
    let temporizador;
    buscar.oninput = () => {
      clearTimeout(temporizador);
      temporizador = setTimeout(() => {
        estado.filtro.q = buscar.value.trim();
        cargarTodo().then(() => {
          const campo = document.getElementById('buscar');
          if (campo) { campo.focus(); campo.setSelectionRange(campo.value.length, campo.value.length); }
        });
      }, 350);
    };
  }
  const filtroEstado = document.getElementById('filtroEstado');
  if (filtroEstado) {
    filtroEstado.onchange = () => { estado.filtro.estado = filtroEstado.value; cargarTodo(); };
  }

  const soltar = document.getElementById('soltar');
  const archivo = document.getElementById('archivo');
  if (soltar && archivo) {
    soltar.onclick = () => archivo.click();
    soltar.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); archivo.click(); } };
    archivo.onchange = () => subirFotos([...archivo.files]);
    soltar.ondragover = e => { e.preventDefault(); soltar.classList.add('encima'); };
    soltar.ondragleave = () => soltar.classList.remove('encima');
    soltar.ondrop = e => {
      e.preventDefault();
      soltar.classList.remove('encima');
      subirFotos([...e.dataTransfer.files].filter(f => f.type.startsWith('image/')));
    };
  }
}

// Última red: si cierra la pestaña con cambios sin guardar, el navegador avisa.
window.addEventListener('beforeunload', e => {
  if (estado.sucio) { e.preventDefault(); e.returnValue = ''; }
});

// ───────────────────────────── arranque ─────────────────────────────

const quienSoy = await api('/api/admin/sesion');
if (quienSoy.autenticada) {
  estado.usuario = quienSoy.usuario;
  await cargarTodo();
} else {
  pintar();
}
</script>
</body>
</html>
