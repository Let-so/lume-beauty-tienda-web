<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ cart.open }}">
<div style="position:fixed;inset:0;z-index:100;display:flex;justify-content:flex-end;font-family:'Jost',sans-serif;color:#3f2a26">
  <div onClick="{{ cart.close }}" style="position:absolute;inset:0;background:rgba(63,42,38,0.28)"></div>
  <aside role="dialog" aria-label="Carrito" style="position:relative;width:min(420px,100%);height:100%;background:#f3eae4;display:flex;flex-direction:column;box-shadow:-24px 0 60px rgba(63,42,38,0.14)">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:22px 24px;border-bottom:1px solid #e3d4ca">
      <span style="font-size:12px;letter-spacing:0.2em">CARRITO ({{ cart.count }})</span>
      <button onClick="{{ cart.close }}" aria-label="Cerrar carrito" style="background:none;border:0;width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:#3f2a26;margin-right:-10px" style-hover="color:#a87a6e"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M5 5l14 14M19 5L5 19"></path></svg></button>
    </div>
    <div style="flex:1;overflow-y:auto;padding:8px 24px">
      <sc-if value="{{ cart.isEmpty }}">
        <div style="padding:48px 0;display:flex;flex-direction:column;align-items:flex-start;gap:18px">
          <p style="margin:0;font-family:'Cormorant Garamond',serif;font-size:28px;line-height:1.1;color:#4a231f">Tu carrito está vacío.</p>
          <button onClick="{{ cart.goShop }}" style="height:42px;padding:0 26px;border:0;border-radius:999px;background:#b38d83;color:#fdf8f5;font-size:10px;letter-spacing:0.24em" style-hover="background:#a07a70">EXPLORAR PRODUCTOS&nbsp;&nbsp;→</button>
        </div>
      </sc-if>
      <sc-for list="{{ cart.items }}" as="it" hint-placeholder-count="0">
        <div style="display:grid;grid-template-columns:78px minmax(0,1fr);gap:14px;padding:18px 0;border-bottom:1px solid #e3d4ca">
          <button onClick="{{ it.open }}" aria-label="Ver producto" style="position:relative;width:78px;height:78px;border:0;padding:0;border-radius:4px;background:#ece1d9;overflow:hidden">
            <img src="{{ it.image }}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:8%;mix-blend-mode:multiply">
          </button>
          <div style="display:flex;flex-direction:column;gap:2px;min-width:0">
            <span style="font-size:10px;letter-spacing:0.1em;text-transform:uppercase">{{ it.brandLabel }}</span>
            <span style="font-size:12.5px;line-height:1.35">{{ it.title }}</span>
            <span style="font-size:11.5px;color:#6f5650">{{ it.size }} · {{ it.priceLabel }}</span>
            <div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px">
              <div style="display:flex;align-items:center;border:1px solid #cdb8ac;border-radius:999px;height:32px">
                <button onClick="{{ it.dec }}" aria-label="Restar una unidad" style="width:32px;height:100%;border:0;background:none;color:#3f2a26;font-size:15px">−</button>
                <span style="min-width:20px;text-align:center;font-size:12px">{{ it.qty }}</span>
                <button onClick="{{ it.inc }}" aria-label="Sumar una unidad" style="width:32px;height:100%;border:0;background:none;color:#3f2a26;font-size:15px">+</button>
              </div>
              <button onClick="{{ it.remove }}" style="background:none;border:0;padding:6px 0;font-size:10px;letter-spacing:0.14em;color:#8a6d65;text-decoration:underline;text-underline-offset:3px" style-hover="color:#4a231f">QUITAR</button>
            </div>
          </div>
        </div>
      </sc-for>
    </div>
    <sc-if value="{{ cart.hasItems }}">
      <div style="padding:20px 24px 24px;border-top:1px solid #e3d4ca;display:flex;flex-direction:column;gap:10px">
        <div style="display:flex;justify-content:space-between;align-items:baseline">
          <span style="font-size:11px;letter-spacing:0.2em">SUBTOTAL</span>
          <span style="font-family:'Cormorant Garamond',serif;font-size:22px;color:#4a231f">{{ cart.subtotalLabel }}</span>
        </div>
        <sc-if value="{{ cart.hasSubtotalNote }}"><p style="margin:0;font-size:11.5px;line-height:1.45;color:#6f5650">{{ cart.subtotalNote }}</p></sc-if>
        <button onClick="{{ cart.buy }}" style="margin-top:6px;height:46px;border:0;border-radius:999px;background:#b38d83;color:#fdf8f5;font-size:10.5px;letter-spacing:0.2em" style-hover="background:#a07a70">COMPRAR POR WHATSAPP</button>
        <p style="margin:0;font-size:11px;line-height:1.45;color:#8a6d65;text-align:center">Te enviaremos a WhatsApp para confirmar y coordinar tu compra.</p>
      </div>
    </sc-if>
  </aside>
</div>
</sc-if>
</x-dc>
</body>
</html>
