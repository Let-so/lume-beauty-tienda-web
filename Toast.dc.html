<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div role="status" aria-live="polite" style="position:fixed;left:0;right:0;bottom:0;z-index:120;display:flex;justify-content:center;padding:0 16px 18px;pointer-events:none;font-family:'Jost',sans-serif">
  <sc-if value="{{ to.show }}">
    <div style="pointer-events:auto;max-width:400px;width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:999px;background:#4a3530;color:#f7ece6;box-shadow:0 14px 34px rgba(63,42,38,0.26)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e7cfc3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
      <span style="flex:1;min-width:0;font-size:11.5px;line-height:1.35;letter-spacing:0.04em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ to.text }}</span>
      <button onClick="{{ to.openCart }}" style="flex:none;background:none;border:0;padding:6px 2px;font-family:'Jost',sans-serif;font-size:9.5px;letter-spacing:0.16em;color:#e7cfc3;text-decoration:underline;text-underline-offset:3px" style-hover="color:#fdf8f5">VER CARRITO</button>
    </div>
  </sc-if>
</div>
</x-dc>
</body>
</html>
