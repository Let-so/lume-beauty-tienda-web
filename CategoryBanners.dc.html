<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section data-screen-label="Categorías" aria-label="Categorías" style="{{ c.gridStyle }}">
  <sc-for list="{{ c.items }}" as="it" hint-placeholder-count="4">
    <button onClick="{{ it.open }}" aria-label="{{ it.ariaLabel }}" style="{{ c.itemStyle }}">
      <img src="{{ it.image }}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 60%;display:block;transition:transform .9s cubic-bezier(.2,.7,.2,1),filter .4s" style-hover="transform:scale(1.035);filter:brightness(1.03)">
    </button>
  </sc-for>
</section>
</x-dc>
</body>
</html>
