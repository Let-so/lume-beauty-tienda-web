<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section data-screen-label="Categorías" aria-label="Categorías" style="background:#f3eae4;padding:clamp(20px,2.6vw,30px) clamp(18px,2.5vw,38px);font-family:'Jost',sans-serif;color:#3f2a26">
  <div style="max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:clamp(16px,4vw,54px)">
    <sc-for list="{{ c.items }}" as="it" hint-placeholder-count="3">
      <button onClick="{{ it.open }}" aria-label="{{ it.ariaLabel }}" style="background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:10px;width:clamp(82px,22vw,128px);cursor:pointer;color:#3f2a26">
        <span style="position:relative;display:block;width:clamp(72px,20vw,112px);height:clamp(72px,20vw,112px);border-radius:50%;overflow:hidden;background:#ece1d9;box-shadow:0 2px 10px rgba(63,42,38,0.06);transition:transform .35s cubic-bezier(.2,.7,.2,1)" style-hover="transform:scale(1.05)">
          <img src="{{ it.image }}" alt="" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block">
        </span>
        <span style="font-size:clamp(9.5px,2.4vw,11px);line-height:1.35;letter-spacing:0.08em;text-align:center;text-wrap:balance;color:#4a3530">{{ it.label }}</span>
      </button>
    </sc-for>
  </div>
</section>
</x-dc>
</body>
</html>
