<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section data-screen-label="Encontrá tu próximo favorito" style="padding:clamp(40px,5vw,72px) clamp(18px,2.5vw,38px);background:#f3eae4;font-family:'Jost',sans-serif;color:#3f2a26">
  <h2 style="margin:0;max-width:18ch;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(30px,3.4vw,50px);line-height:1.02;letter-spacing:-0.01em;color:#4a231f">{{ co.title }}</h2>
  <p style="margin:12px 0 0;max-width:52ch;font-size:13.5px;line-height:1.55;color:#6f5650">{{ co.text }}</p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:13px;margin-top:clamp(24px,3vw,38px)">
    <sc-for list="{{ co.items }}" as="g" hint-placeholder-count="3">
      <button onClick="{{ g.open }}" aria-label="{{ g.ariaLabel }}" style="text-align:left;border:0;border-radius:4px;background:#ece1d9;padding:20px 20px 18px;display:flex;flex-direction:column;gap:16px;color:#3f2a26;cursor:pointer;transition:background .3s" style-hover="background:#e6d7cd">
        <div style="display:flex;gap:6px;height:96px;width:100%">
          <sc-for list="{{ g.thumbs }}" as="t" hint-placeholder-count="2">
            <div style="flex:1;min-width:0;position:relative;background:#f3eae4;border-radius:3px;overflow:hidden"><img src="{{ t.image }}" alt="" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:9%;mix-blend-mode:multiply"></div>
          </sc-for>
        </div>
        <div style="display:flex;flex-direction:column;gap:5px">
          <span style="font-family:'Cormorant Garamond',serif;font-weight:500;font-size:27px;line-height:1.05;color:#4a231f">{{ g.label }}</span>
          <span style="font-size:11.5px;line-height:1.45;color:#6f5650">{{ g.note }}</span>
        </div>
        <span style="display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;font-size:10px;letter-spacing:0.16em;color:#8a6d65"><span>{{ g.countLabel }}</span><span style="color:#4a3530">VER&nbsp;&nbsp;→</span></span>
      </button>
    </sc-for>
  </div>
</section>
</x-dc>
</body>
</html>
