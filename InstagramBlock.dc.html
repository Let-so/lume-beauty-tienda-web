<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section data-screen-label="Instagram" style="padding:clamp(42px,5vw,72px) clamp(18px,2.5vw,38px);background:#ece1d9;font-family:'Jost',sans-serif;color:#3f2a26">
  <div style="max-width:1180px;margin:0 auto;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px">
    <span style="font-size:10.5px;letter-spacing:0.28em;color:#8a6d65">{{ ig.handle }}</span>
    <h2 style="margin:0;max-width:17ch;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(30px,3.4vw,50px);line-height:1.02;letter-spacing:-0.01em;color:#4a231f">{{ ig.title }}</h2>
    <p style="margin:0;max-width:46ch;font-size:13.5px;line-height:1.6;color:#6f5650">{{ ig.text }}</p>
  </div>

  <sc-if value="{{ ig.hasPosts }}" hint-placeholder-val="{{ true }}">
    <div style="{{ ig.gridStyle }}">
      <sc-for list="{{ ig.posts }}" as="p" hint-placeholder-count="4">
        <div style="{{ ig.cellStyle }}">
          <iframe src="{{ p.embed }}" title="{{ p.title }}" loading="lazy" style="{{ ig.frameStyle }}"></iframe>
        </div>
      </sc-for>
    </div>
  </sc-if>

  <div style="max-width:1180px;margin:clamp(24px,3vw,38px) auto 0;display:flex;justify-content:center">
    <button onClick="{{ ig.open }}" style="height:46px;padding:0 30px;border:0;border-radius:999px;background:#b38d83;color:#fdf8f5;display:flex;align-items:center;gap:10px;font-family:'Jost',sans-serif;font-size:10px;letter-spacing:0.22em;transition:background .25s" style-hover="background:#a07a70">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"></circle></svg>{{ ig.ctaLabel }}&nbsp;&nbsp;→
    </button>
  </div>
</section>
</x-dc>
</body>
</html>
