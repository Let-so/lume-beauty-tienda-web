<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="position:relative;z-index:30;background:#f3eae4;font-family:'Jost',sans-serif;color:#3f2a26">
<sc-if value="{{ h.isDesktop }}" hint-placeholder-val="{{ true }}">
  <div style="display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;height:96px;padding:0 40px">
    <nav aria-label="Principal" style="display:flex;align-items:center;gap:clamp(20px,2.3vw,36px)">
      <button onClick="{{ h.goShop }}" style="background:none;border:0;padding:6px 0;font-size:10.5px;letter-spacing:0.16em;color:#3f2a26" style-hover="color:#a87a6e">SHOP</button>
      <button onClick="{{ h.goPerfumes }}" style="background:none;border:0;padding:6px 0;font-size:10.5px;letter-spacing:0.16em;color:#3f2a26" style-hover="color:#a87a6e">PERFUMES</button>
      <button onClick="{{ h.goBrands }}" style="background:none;border:0;padding:6px 0;font-size:10.5px;letter-spacing:0.16em;color:#3f2a26" style-hover="color:#a87a6e">MARCAS</button>
      <button onClick="{{ h.goTips }}" style="background:none;border:0;padding:6px 0;font-size:10.5px;letter-spacing:0.16em;color:#3f2a26" style-hover="color:#a87a6e">CONSEJOS</button>
      <button onClick="{{ h.goHelp }}" style="background:none;border:0;padding:6px 0;font-size:10.5px;letter-spacing:0.16em;color:#3f2a26" style-hover="color:#a87a6e">AYUDA</button>
    </nav>
    <button onClick="{{ h.goHome }}" aria-label="LUMÉ Beauty — inicio" style="background:none;border:0;padding:0 18px 0 0;display:flex;flex-direction:column;align-items:center;color:#a87a6e">
      <span style="position:relative;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:50px;line-height:0.86;letter-spacing:0.02em">LUMÉ<svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true" style="position:absolute;top:-10px;right:-17px"><path d="M12 0C12.8 8.2 15.8 11.2 24 12C15.8 12.8 12.8 15.8 12 24C11.2 15.8 8.2 12.8 0 12C8.2 11.2 11.2 8.2 12 0Z" fill="currentColor"></path></svg></span>
      <span style="font-size:10.5px;letter-spacing:0.62em;padding-left:0.62em;margin-top:7px;color:#ad8679">BEAUTY</span>
    </button>
    <div style="display:flex;justify-content:flex-end;align-items:center;gap:clamp(16px,2vw,32px)">
      <div style="display:flex;align-items:center;gap:20px">
        <button onClick="{{ h.onSearch }}" aria-label="Buscar" style="background:none;border:0;padding:4px;display:flex;color:#3f2a26" style-hover="color:#a87a6e"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5L20.5 20.5"></path></svg></button>
        <input value="{{ h.query }}" onChange="{{ h.onQuery }}" onKeyDown="{{ h.onKey }}" placeholder="BUSCAR..." aria-label="Buscar productos" style="width:clamp(110px,11vw,180px);border:0;border-bottom:1px solid #b9a097;background:transparent;padding:6px 0;font-size:10px;letter-spacing:0.12em;color:#3f2a26;outline:none">
      </div>
      <button onClick="{{ h.goFavs }}" aria-label="Ver favoritos" style="background:none;border:0;padding:4px;display:flex;align-items:center;gap:6px;color:#3f2a26" style-hover="color:#a87a6e"><svg width="21" height="21" viewBox="0 0 24 24" fill="{{ h.favFill }}" stroke="currentColor" stroke-width="1.3"><path d="M12 20.3s-7.6-4.6-7.6-10.3A4.2 4.2 0 0 1 12 7.5a4.2 4.2 0 0 1 7.6 2.5c0 5.7-7.6 10.3-7.6 10.3z"></path></svg><span style="font-size:10.5px">{{ h.favCount }}</span></button>
      <button onClick="{{ h.openCart }}" aria-label="Abrir carrito" style="background:none;border:0;padding:4px;display:flex;align-items:center;gap:6px;color:#3f2a26" style-hover="color:#a87a6e"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M4.5 8h15l-1.1 13H5.6L4.5 8z"></path><path d="M8.8 8V6.2a3.2 3.2 0 0 1 6.4 0V8"></path></svg><span style="font-size:10.5px">{{ h.cartCount }}</span></button>
    </div>
  </div>
</sc-if>
<sc-if value="{{ h.isCompact }}">
  <div style="display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;height:70px;padding:0 10px">
    <div style="display:flex">
      <button onClick="{{ h.toggleMenu }}" aria-label="Menú" aria-expanded="{{ h.menuOpen }}" style="background:none;border:0;width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#3f2a26">
        <sc-if value="{{ h.menuClosed }}" hint-placeholder-val="{{ true }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M3 7h18M3 12h18M3 17h18"></path></svg></sc-if>
        <sc-if value="{{ h.menuOpen }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M5 5l14 14M19 5L5 19"></path></svg></sc-if>
      </button>
    </div>
    <button onClick="{{ h.goHome }}" aria-label="LUMÉ Beauty — inicio" style="background:none;border:0;padding:0 12px 0 0;display:flex;flex-direction:column;align-items:center;color:#a87a6e">
      <span style="position:relative;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:36px;line-height:0.86;letter-spacing:0.02em">LUMÉ<svg width="10" height="10" viewBox="0 0 24 24" aria-hidden="true" style="position:absolute;top:-7px;right:-12px"><path d="M12 0C12.8 8.2 15.8 11.2 24 12C15.8 12.8 12.8 15.8 12 24C11.2 15.8 8.2 12.8 0 12C8.2 11.2 11.2 8.2 12 0Z" fill="currentColor"></path></svg></span>
      <span style="font-size:8.5px;letter-spacing:0.6em;padding-left:0.6em;margin-top:5px;color:#ad8679">BEAUTY</span>
    </button>
    <div style="display:flex;justify-content:flex-end">
      <button onClick="{{ h.toggleSearch }}" aria-label="Buscar" style="background:none;border:0;width:40px;height:44px;display:flex;align-items:center;justify-content:center;color:#3f2a26"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5L20.5 20.5"></path></svg></button>
      <button onClick="{{ h.goFavs }}" aria-label="Ver favoritos" style="background:none;border:0;height:44px;padding:0 6px;display:flex;align-items:center;gap:3px;color:#3f2a26"><svg width="20" height="20" viewBox="0 0 24 24" fill="{{ h.favFill }}" stroke="currentColor" stroke-width="1.3"><path d="M12 20.3s-7.6-4.6-7.6-10.3A4.2 4.2 0 0 1 12 7.5a4.2 4.2 0 0 1 7.6 2.5c0 5.7-7.6 10.3-7.6 10.3z"></path></svg><span style="font-size:10.5px">{{ h.favCount }}</span></button>
      <button onClick="{{ h.openCart }}" aria-label="Abrir carrito" style="background:none;border:0;height:44px;padding:0 6px;display:flex;align-items:center;gap:4px;color:#3f2a26"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M4.5 8h15l-1.1 13H5.6L4.5 8z"></path><path d="M8.8 8V6.2a3.2 3.2 0 0 1 6.4 0V8"></path></svg><span style="font-size:10.5px">{{ h.cartCount }}</span></button>
    </div>
  </div>
  <sc-if value="{{ h.searchOpen }}">
    <div style="padding:0 20px 14px;display:flex;gap:10px;align-items:center">
      <input value="{{ h.query }}" onChange="{{ h.onQuery }}" onKeyDown="{{ h.onKey }}" placeholder="BUSCAR..." aria-label="Buscar productos" style="flex:1;min-width:0;border:0;border-bottom:1px solid #b9a097;background:transparent;padding:10px 0;font-size:12px;letter-spacing:0.12em;color:#3f2a26;outline:none">
      <button onClick="{{ h.onSearch }}" style="background:none;border:0;height:44px;padding:0 4px;font-size:10px;letter-spacing:0.18em;color:#3f2a26">IR →</button>
    </div>
  </sc-if>
  <sc-if value="{{ h.menuOpen }}">
    <nav aria-label="Menú móvil" style="position:absolute;top:100%;left:0;right:0;max-height:calc(100vh - 70px);overflow-y:auto;background:#f3eae4;border-top:1px solid #e6d8cf;padding:4px 22px 24px;display:flex;flex-direction:column;box-shadow:0 24px 40px rgba(63,42,38,0.10)">
      <button onClick="{{ h.goShop }}" style="background:none;border:0;border-bottom:1px solid #e6d8cf;text-align:left;padding:16px 0;font-size:12px;letter-spacing:0.2em;color:#3f2a26">TODOS LOS PRODUCTOS</button>
      <sc-for list="{{ h.cats }}" as="c" hint-placeholder-count="2">
        <button onClick="{{ c.open }}" style="background:none;border:0;border-bottom:1px solid #e6d8cf;text-align:left;padding:16px 0 16px 14px;font-size:12px;letter-spacing:0.2em;color:#6f5650">{{ c.label }}</button>
      </sc-for>
      <button onClick="{{ h.goBrands }}" style="background:none;border:0;border-bottom:1px solid #e6d8cf;text-align:left;padding:16px 0;font-size:12px;letter-spacing:0.2em;color:#3f2a26">MARCAS</button>
      <button onClick="{{ h.goTips }}" style="background:none;border:0;border-bottom:1px solid #e6d8cf;text-align:left;padding:16px 0;font-size:12px;letter-spacing:0.2em;color:#3f2a26">CONSEJOS</button>
      <button onClick="{{ h.goFavs }}" style="background:none;border:0;border-bottom:1px solid #e6d8cf;text-align:left;padding:16px 0;display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:0.2em;color:#3f2a26">FAVORITOS<span style="font-size:10px;color:#8a6d65">{{ h.favCount }}</span></button>
      <button onClick="{{ h.goHelp }}" style="background:none;border:0;text-align:left;padding:16px 0;font-size:12px;letter-spacing:0.2em;color:#3f2a26">AYUDA</button>
    </nav>
  </sc-if>
</sc-if>
</header>
</x-dc>
</body>
</html>
